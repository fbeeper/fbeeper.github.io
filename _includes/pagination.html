<div class="pagination">
  {% if paginator.next_page %}
    <a class="pagination-older" href="{{ site.baseurl }}/page{{paginator.next_page}}"><i class="fas fa-angle-left"></i> Older</a>
  {% endif %}
  {% if paginator.previous_page %}
    {% if paginator.page == 2 %}
      <a class="pagination-newer" href="{{ site.baseurl }}/">Newer <i class="fas fa-angle-right"></i></a>
    {% else %}
      <a class="pagination-newer" href="{{ site.baseurl }}/page{{paginator.previous_page}}">Newer <i class="fas fa-angle-right"></i></a>
    {% endif %}
  {% endif %}
</div>
